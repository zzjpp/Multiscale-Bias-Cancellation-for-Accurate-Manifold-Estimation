[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "e1-simulation"
version = "1.0.0"
description = "Reproduction package for the E1 population-error figures"
requires-python = ">=3.10"
dependencies = [
  "matplotlib==3.11.1",
  "numpy==2.4.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

