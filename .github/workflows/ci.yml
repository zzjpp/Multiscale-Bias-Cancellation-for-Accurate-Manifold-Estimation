name: Offline CPU checks
on: [push, pull_request]
jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
      - run: python -m pip install -r requirements.txt
      - run: python validate_release.py
      - run: python verify_paper.py
      - run: python -m pytest -q tests --basetemp ./tmp/pytest
      - run: python run_paper.py --profile smoke --backend cpu --output ./smoke_run --workers 2
